[workspace]
resolver = "3"
members = ["engine", "ui", "sim", "launcher"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
engine = { path = "engine" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rand_chacha = { version = "0.10.0", default-features = false }
leptos = { version = "0.8.23", features = ["csr"] }
console_error_panic_hook = "0.1.7"

# Small WASM files for the web build (KONZEPT.md, "Werkzeuge und Zubehör").
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
